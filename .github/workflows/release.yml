name: Build and release

# every push to main builds the package (download it from the run's "Artifacts");
# a tag like v0.1.0 also publishes it as a GitHub release with the zip attached
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Core tests
        shell: pwsh
        run: dotnet run --project TerrainTool\tests\CoreTest\CoreTest.csproj -c Release

      - name: Build the package
        shell: pwsh
        run: .\tools\make-release.ps1 -Version ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: BMSSuite-${{ steps.ver.outputs.version }}
          path: dist/BMSSuite-${{ steps.ver.outputs.version }}.zip

      - name: GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "dist/BMSSuite-${{ steps.ver.outputs.version }}.zip" --title "BMS Suite ${{ steps.ver.outputs.version }}" --generate-notes
